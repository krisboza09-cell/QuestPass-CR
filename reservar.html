<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestPass CR | Reservar</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <a href="index.html">QuestPass CR</a>

        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reservar.html">Reservar</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>

        <section class="seccion-formulario">

            <h1>Reservar experiencia</h1>

            <p>
                Completa el formulario para reservar tu experiencia en QuestPass CR.
            </p>

            <form>

                <div class="campo-formulario">
                    <label for="nombre">Nombre completo</label>

                    <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="60">
                </div>

                <div class="campo-formulario">
                    <label for="correo">Correo</label>

                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="campo-formulario">
                    <label for="telefono">Teléfono</label>

                    <input type="tel" id="telefono" name="telefono" required maxlength="9">
                </div>

                <div class="campo-formulario">
                    <label for="experiencia">Experiencia</label>

                    <select id="experiencia" name="experiencia" required>

                        <option value="">Seleccione una experiencia</option>

                        <option value="QST-001">
                            El Archivo 47
                        </option>

                        <option value="QST-002">
                            Retro Arena 16-Bit
                        </option>

                        <option value="QST-003">
                            Cosplay SOS: de cero a personaje
                        </option>

                        <option value="QST-004">
                            Multiverso Geek: Trivia en vivo
                        </option>

                        <option value="QST-005">
                            Primera misión: D&amp;D para principiantes
                        </option>

                        <option value="QST-006">
                            Miniaturas: pintura rápida
                        </option>

                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="cantidad">Cantidad de entradas</label>

                    <input type="number" id="cantidad" name="cantidad" required min="1" max="4">
                </div>

                <div class="campo-condiciones">

                    <input type="checkbox" id="condiciones" name="condiciones" required>

                    <label for="condiciones">
                        Acepto <a href="#" title="Ver términos y condiciones" aria-label="Ver términos y condiciones">
                            las condiciones
                        </a>
                    </label>

                </div>

                <button type="submit">
                    Reservar
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>QuestPass CR</p>
    </footer>

</body>

</html>
