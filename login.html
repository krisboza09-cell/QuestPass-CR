<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestPass CR | Iniciar sesión</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <a href="index.html">QuestPass CR</a>

        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reservar.html">Reservar</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>

        <section class="seccion-login">

            <h1>Iniciar sesión</h1>

            <p>
                Ingresa tus datos para acceder a QuestPass CR.
            </p>

            <form class="formulario-login">

                <div class="campo-formulario">
                    <label for="correo-login">Correo</label>

                    <input
                        type="email"
                        id="correo-login"
                        name="correo"
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required>
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>QuestPass CR</p>
    </footer>

</body>

</html>
